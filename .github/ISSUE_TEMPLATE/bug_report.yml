name: 🐛 Bug report
description: Report a reproducible problem so maintainers can fix it fast.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, exact URLs, and any selected options.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Environment
      description: Browser + OS, or Node/CLI context.
      placeholder: "Chrome 120 on Windows 11 / Node 22"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console / logs
      description: Paste relevant console errors, network failures, or server logs.
      render: shell
    validations:
      required: false
  - type: textarea
    id: code
    attributes:
      label: Stack trace
      description: Paste the full stack trace if available.
      render: shell
    validations:
      required: false