name: ✨ Feature request
description: Propose a new capability or an improvement to an existing one.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What limitation or pain point motivates this request?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or change as concretely as you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you tried or thought about.
    validations:
      required: false
  - type: textarea
    id: user_stories
    attributes:
      label: Acceptance criteria (optional)
      description: Bullet list, "Como … quiero … para …". Leave blank if unknown.
    validations:
      required: false