name: Verify Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Automated Test Suite (Vitest)
        run: npm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://bksonxnxshxinqffswqc.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_NMmYBCHV_xhHpcPWDS2DLA_5lhUeGSb
          RESEND_API_KEY: re_test_mock_key
          RESEND_WEBHOOK_SECRET: whsec_MfValidSecretForTesting123=
          GROQ_API_KEY: gsk_test_mock_key
          CI: true

      - name: Type check and Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://bksonxnxshxinqffswqc.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_NMmYBCHV_xhHpcPWDS2DLA_5lhUeGSb
          NEXT_PUBLIC_SITE_URL: https://exepaginasweb.com
          CI: true
